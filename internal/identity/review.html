<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merge</title>
  <link rel="stylesheet" href="/review.css">
  <script type="module" src="/review.js"></script>
</head>
<body>
  <header>
    <h1>Merge</h1>
    <nav aria-label="Actions">
      <button id="refresh" type="button">Refresh</button>
      <button id="undo" type="button" disabled>Undo</button>
      <a href="/api/export" download>Export</a>
    </nav>
  </header>
  <main>
    <fieldset id="review">
      <div class="filters">
        <label>Type
          <select id="scope"><option value="iem">IEMs</option><option value="brand">Brands</option></select>
        </label>
        <label class="search">Search<input id="search" type="search"></label>
        <label>Match
          <select id="threshold">
            <option value="1">100%</option><option value="0.9">90%</option>
            <option value="0.8" selected>80%</option><option value="0.7">70%</option><option value="0.55">55%</option>
          </select>
        </label>
      </div>
      <p id="count"></p>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="matches" aria-label="Matches"></section>
      <nav class="pagination" aria-label="Pages">
        <button id="previous" type="button" disabled>Previous</button>
        <span id="page"></span>
        <button id="next" type="button" disabled>Next</button>
      </nav>
      <details>
        <summary>Manual merge</summary>
        <div class="pair">
          <section>
            <label>Merge<input id="merge-search" type="search"></label>
            <div id="merge-results" class="results"></div>
            <output id="merge-selected"></output>
          </section>
          <section>
            <label>Keep<input id="keep-search" type="search"></label>
            <div id="keep-results" class="results"></div>
            <output id="keep-selected"></output>
          </section>
        </div>
        <button id="manual-merge" type="button" disabled>Merge</button>
      </details>
      <details>
        <summary>History</summary>
        <ol id="history"></ol>
      </details>
    </fieldset>
  </main>
</body>
</html>
